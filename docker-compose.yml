services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apadrinhamento}
      POSTGRES_USER: ${POSTGRES_USER:-apadrinha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apadrinha_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apadrinha -d apadrinhamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/apadrinhamento}
      DB_USERNAME: ${DB_USERNAME:-apadrinha}
      DB_PASSWORD: ${DB_PASSWORD:-apadrinha_dev}
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-altere-esta-chave-antes-de-publicar-o-sistema-2026}
      TOKEN_HOURS: ${TOKEN_HOURS:-8}
    depends_on:
      database:
        condition: service_healthy

  web:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
