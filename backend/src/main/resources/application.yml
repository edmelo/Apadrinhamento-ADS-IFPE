spring:
  application:
    name: apadrinhamento-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:apadrinhamento;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-ao-menos-32-caracteres}
  token-hours: ${TOKEN_HOURS:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info
